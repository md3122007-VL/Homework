<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Quay thưởng may mắn</h2>
    <button onclick="quayThuong()">Quay thưởng</button>

    <h3 id="ketqua">Bấm nút để nhận quà may mắn!</h3>

<script>
    function quayThuong() {
        let dsPhanQua = ["1 triệu đồng ","Tai nghe không dây ", "5 triệu đồng", "Xe máy ", "Chúc bạn may mắn lần sau "];
        let quaNgauNhien = dsPhanQua[Math.floor(Math.random() * dsPhanQua.length)];
        document.getElementById("ketqua").innerHTML = "Phần thưởng của bạn là: <strong>" + quaNgauNhien + "</strong>";
    }
</script>
</body>
</html>
