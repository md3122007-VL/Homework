<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Số Lớn Nhất Trong Mảng</title>
</head>
<body>

    <h2>Bài tập 13: Viết hàm calculateGrade để tính điểm trung bình từ một mảng điểm số và trả về xếp loại dựa trên điểm trung bình đó.</h2>
    <h3>Mảng xếp loại là: <div id="calculate1"></h3>
    <h3>Mảng xếp loại là: <div id="calculate2"></h3>

<script>
    function calculateGrade(arr) {
        if (arr.length === 0) return "F";
        let sum = arr[0];
        for (let i = 1; i < arr.length; i++) {
            sum += arr[i];
        }
        let avg = sum / arr.length;
        if (avg >= 90) return "A";
        else if (avg >= 80) return "B";
        else if (avg >= 70) return "C";
        else if (avg >= 60) return "D";
        return "F";
    }

    document.getElementById("calculate1").innerText = calculateGrade([95, 90, 85, 100]);
    document.getElementById("calculate2").innerText = calculateGrade([70, 65, 80, 60]);
</script>

</body>
</html>
