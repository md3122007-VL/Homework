<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Số Lớn Nhất Trong Mảng</title>
</head>
<body>
    
    <h2>Kết quả tổng số lẻ trong mảng:</h2>
    <h3>Mảng [1, 2, 3, 4, 5] tổng số lẻ là: <div id="tsole"></h3>
<script>
    function timsole(arr){
        if (arr.length === 0) return undefined;
        let sum = arr[0];
        for (let i = 1; i < arr.length; i++) {
            if (arr[i] % 2 != 0){
                sum += arr[i]
            }
        }
        return sum;
    }
    document.getElementById("tsole").innerText = timsole([1,2,3,4,5]);
</script>

</body>
</html>
