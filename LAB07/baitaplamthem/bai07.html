<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Số Lớn Nhất Trong Mảng</title>
</head>
<body>

    <h2>Kết quả tìm số lớn nhất (findMax):</h2>
    <h3>Mảng [1, 3, 5, 7, 9] -> Max là: <div id="as1"></h3>


<script>
    function  isAscending(arr) {
        if (arr.length === 1) return "mảng rỗng";
        let ascend = arr[0];
        ascend1 = 0
        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > ascend1) {
                ascend1 = arr[i];
            }
            else{
                return false;
            }
        }
        return true;
    }
    document.getElementById("as1").innerText = isAscending([1, 2, 3, 5]);
</script>

</body>
</html>
